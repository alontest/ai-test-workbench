name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Run aw verify (SQLite)
        run: python3 .aw/aw.py verify specs/ai-test-workbench_20261117184149
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            .aw/tmp/**
            reports/**
          if-no-files-found: ignore

  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: workbench_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AW_TEST_DATABASE_URL: mysql+asyncmy://root:ci-root@127.0.0.1:3306/workbench_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: alembic upgrade head
        run: uv run alembic upgrade head
        env:
          AW_DATABASE_URL: mysql+asyncmy://root:ci-root@127.0.0.1:3306/workbench_test?charset=utf8mb4
      - name: Run pytest suite (DB migration tests use MySQL)
        run: uv run pytest -q --junitxml=reports/mysql.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-reports
          path: reports/**
          if-no-files-found: ignore

  # frontend-tests（Node 22 + Vitest）按 TASK-TD-018 的依赖说明，在
  # TASK-TD-021 落地 web/ 后再补入。批次 A 无前端代码，此处不设占位 job：
  # 占位 job 会在没有 package.json 时空跑并显示 success，形成假门禁。
