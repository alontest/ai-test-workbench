name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Run pytest suite (SQLite)
        run: uv run pytest -q --junitxml=reports/sqlite.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: reports/**
          if-no-files-found: ignore

  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: workbench_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AW_TEST_DATABASE_URL: mysql+asyncmy://root:ci-root@127.0.0.1:3306/workbench_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: alembic upgrade head
        run: uv run alembic upgrade head
        env:
          AW_DATABASE_URL: mysql+asyncmy://root:ci-root@127.0.0.1:3306/workbench_test?charset=utf8mb4
      - name: Run pytest suite (DB migration tests use MySQL)
        run: uv run pytest -q --junitxml=reports/mysql.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-reports
          path: reports/**
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run Vitest
        run: npm run test -- --run
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: web/coverage
          if-no-files-found: ignore
