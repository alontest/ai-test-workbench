<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Test Workbench · 交互原型</title>
<style>
  /* ===== Design Tokens（与 design.md 逐字对应） ===== */
  :root{
    --color-primary:#1E293B;
    --color-on-primary:#FFFFFF;
    --color-primary-hover:#0F172A;
    --color-secondary:#475569;
    --color-on-secondary:#FFFFFF;
    --color-accent:#16A34A;
    --color-on-accent:#FFFFFF;
    --color-background:#F8FAFC;
    --color-foreground:#0F172A;
    --color-card:#FFFFFF;
    --color-card-foreground:#0F172A;
    --color-muted:#F1F5F9;
    --color-muted-foreground:#475569;
    --color-border:#CBD5E1;
    --color-input:#FFFFFF;
    --color-destructive:#DC2626;
    --color-on-destructive:#FFFFFF;
    --color-success:#16A34A;
    --color-warning:#B45309;
    --color-info:#0284C7;
    --color-ring:#1E293B;
    --font-family-base:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --font-family-heading:"JetBrains Mono","SFMono-Regular",Menlo,monospace;
    --font-family-mono:"JetBrains Mono","SFMono-Regular",Menlo,monospace;
    --font-size-xs:12px;
    --font-size-sm:13px;
    --font-size-base:14px;
    --font-size-md:16px;
    --font-size-lg:18px;
    --font-size-xl:24px;
    --font-size-2xl:32px;
    --font-weight-normal:400;
    --font-weight-medium:500;
    --font-weight-bold:600;
    --line-height-tight:1.25;
    --line-height-base:1.5;
    --line-height-relaxed:1.7;
    --spacing-1:4px;
    --spacing-2:8px;
    --spacing-3:12px;
    --spacing-4:16px;
    --spacing-6:24px;
    --spacing-8:32px;
    --spacing-12:48px;
    --spacing-16:64px;
    --radius-sm:4px;
    --radius-md:8px;
    --radius-lg:12px;
    --radius-full:9999px;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.08);
    --shadow-md:0 4px 6px rgba(15,23,42,0.12);
    --shadow-lg:0 10px 15px rgba(15,23,42,0.18);
    --duration-fast:120ms;
    --duration-base:180ms;
    --duration-slow:240ms;
    --easing-standard:cubic-bezier(0.2,0,0,1);
    --sidebar-width:248px;
    --topbar-height:64px;
    --content-max-width:1280px;
  }
  html[data-theme="dark"]{
    --color-primary:#EDEDED;
    --color-on-primary:#0A0A0B;
    --color-primary-hover:#D4D4D8;
    --color-secondary:#26262B;
    --color-on-secondary:#EDEDED;
    --color-accent:#22C55E;
    --color-on-accent:#0A0A0B;
    --color-background:#0A0A0B;
    --color-foreground:#EDEDED;
    --color-card:#141416;
    --color-card-foreground:#EDEDED;
    --color-muted:#1C1C1F;
    --color-muted-foreground:#A1A1AA;
    --color-border:#2A2A2E;
    --color-input:#0A0A0B;
    --color-destructive:#EF4444;
    --color-on-destructive:#0A0A0B;
    --color-success:#22C55E;
    --color-warning:#F59E0B;
    --color-info:#38BDF8;
    --color-ring:#22C55E;
    --shadow-sm:0 1px 2px rgba(0,0,0,.6);
    --shadow-md:0 4px 10px rgba(0,0,0,.55);
    --shadow-lg:0 16px 32px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-family-base);
    font-size:var(--font-size-base);
    line-height:var(--line-height-base);
    color:var(--color-foreground);
    background:var(--color-background);
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:var(--color-accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--color-ring);outline-offset:2px}
  .app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;min-height:100vh}

  /* ===== Sidebar ===== */
  .sidebar{
    background:var(--color-card);border-right:1px solid var(--color-border);
    padding:var(--spacing-4);display:flex;flex-direction:column;gap:var(--spacing-6);
    position:sticky;top:0;height:100vh;overflow:auto;
  }
  .brand{display:flex;align-items:center;gap:var(--spacing-2);font-family:var(--font-family-heading);font-weight:var(--font-weight-bold);font-size:var(--font-size-md)}
  .brand-mark{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;font-size:11px;font-weight:700}
  .nav-group{display:flex;flex-direction:column;gap:2px}
  .nav-title{font-size:var(--font-size-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted-foreground);padding:0 var(--spacing-2);margin-bottom:var(--spacing-1)}
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-2);
    padding:var(--spacing-2) var(--spacing-3);border-radius:var(--radius-sm);
    background:transparent;border:1px solid transparent;cursor:pointer;text-align:left;
    color:var(--color-foreground);transition:background var(--duration-fast) var(--easing-standard);
  }
  .nav-item:hover{background:var(--color-muted)}
  .nav-item.active{background:var(--color-muted);border-color:var(--color-border);font-weight:var(--font-weight-medium)}
  .nav-tag{font-size:10px;color:var(--color-muted-foreground);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:0 6px}

  /* ===== Main ===== */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{
    height:var(--topbar-height);display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-3);
    padding:0 var(--spacing-6);border-bottom:1px solid var(--color-border);
    background:var(--color-background);position:sticky;top:0;z-index:20;
  }
  .topbar-left{display:flex;align-items:center;gap:var(--spacing-3);min-width:0}
  .menu-btn{display:none}
  .page-title{font-family:var(--font-family-heading);font-size:var(--font-size-md);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page-sub{font-size:var(--font-size-xs);color:var(--color-muted-foreground);margin:0}
  .topbar-actions{display:flex;align-items:center;gap:var(--spacing-2);flex-wrap:wrap;justify-content:flex-end}
  .state-switch{display:flex;border:1px solid var(--color-border);border-radius:var(--radius-full);overflow:hidden;background:var(--color-card)}
  .state-switch button{
    border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:var(--font-size-xs);
    color:var(--color-muted-foreground);transition:background var(--duration-fast) var(--easing-standard);
  }
  .state-switch button:hover{background:var(--color-muted)}
  .state-switch button.active{background:var(--color-primary);color:var(--color-on-primary)}
  .icon-btn{
    border:1px solid var(--color-border);background:var(--color-card);border-radius:var(--radius-sm);
    padding:6px 10px;cursor:pointer;font-size:var(--font-size-xs)
  }
  .icon-btn:hover{background:var(--color-muted)}
  .content{padding:var(--spacing-6);max-width:var(--content-max-width);width:100%;margin:0 auto}

  /* ===== Generic ===== */
  .h1{font-family:var(--font-family-heading);font-size:var(--font-size-2xl);line-height:var(--line-height-tight);margin:0 0 var(--spacing-2)}
  .h2{font-size:var(--font-size-lg);margin:0 0 var(--spacing-1)}
  .muted{color:var(--color-muted-foreground)}
  .small{font-size:var(--font-size-xs)}
  .mono{font-family:var(--font-family-mono)}
  .row{display:flex;align-items:center;gap:var(--spacing-2);flex-wrap:wrap}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-3);flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:var(--spacing-4)}
  .card{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--spacing-4)}
  .section{margin-top:var(--spacing-8)}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--spacing-3);margin-bottom:var(--spacing-3)}
  .grid{display:grid;gap:var(--spacing-3)}
  .grid-entrances{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}

  .btn{
    border:1px solid var(--color-border);background:var(--color-card);color:var(--color-foreground);
    padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;min-height:36px;
    transition:background var(--duration-fast) var(--easing-standard);
  }
  .btn:hover{background:var(--color-muted)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
  .btn-primary:hover{background:var(--color-primary-hover)}
  .btn-danger{background:var(--color-destructive);border-color:var(--color-destructive);color:var(--color-on-destructive)}
  .btn-accent{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
  .btn-sm{padding:4px 10px;min-height:28px;font-size:var(--font-size-xs)}
  .link{border:0;background:none;color:var(--color-accent);cursor:pointer;padding:0;font-size:inherit}
  .link:hover{text-decoration:underline}

  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-full);padding:1px 10px;font-size:var(--font-size-xs);border:1px solid transparent;white-space:nowrap}
  .badge-info{color:var(--color-info);border-color:var(--color-info);background:color-mix(in srgb,var(--color-info) 12%,transparent)}
  .badge-success{color:var(--color-success);border-color:var(--color-success);background:color-mix(in srgb,var(--color-success) 12%,transparent)}
  .badge-danger{color:var(--color-destructive);border-color:var(--color-destructive);background:color-mix(in srgb,var(--color-destructive) 12%,transparent)}
  .badge-warning{color:var(--color-warning);border-color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 12%,transparent)}
  .badge-muted{color:var(--color-muted-foreground);border-color:var(--color-border)}

  .banner{display:flex;gap:var(--spacing-2);align-items:flex-start;border-radius:var(--radius-md);padding:var(--spacing-3);border:1px solid;margin-bottom:var(--spacing-4);font-size:var(--font-size-sm)}
  .banner-success{color:var(--color-success);border-color:color-mix(in srgb,var(--color-success) 40%,transparent);background:color-mix(in srgb,var(--color-success) 8%,transparent)}
  .banner-error{color:var(--color-destructive);border-color:color-mix(in srgb,var(--color-destructive) 40%,transparent);background:color-mix(in srgb,var(--color-destructive) 8%,transparent)}
  .banner-info{color:var(--color-info);border-color:color-mix(in srgb,var(--color-info) 40%,transparent);background:color-mix(in srgb,var(--color-info) 8%,transparent)}

  table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm)}
  th{ text-align:left;font-weight:var(--font-weight-medium);color:var(--color-muted-foreground);background:var(--color-muted);padding:var(--spacing-2) var(--spacing-3);border-bottom:1px solid var(--color-border);white-space:nowrap}
  td{padding:var(--spacing-3);border-bottom:1px solid var(--color-border);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:color-mix(in srgb,var(--color-muted) 60%,transparent)}
  .table-wrap{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:auto}
  .empty-cell{text-align:center;padding:var(--spacing-8) var(--spacing-4);color:var(--color-muted-foreground)}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--spacing-3)}
  .field label{font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}
  .field .hint{font-size:var(--font-size-xs);color:var(--color-muted-foreground)}
  .field .err{font-size:var(--font-size-xs);color:var(--color-destructive)}
  input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{
    background:var(--color-input);border:1px solid var(--color-border);border-radius:var(--radius-sm);
    padding:8px 10px;min-height:36px;width:100%;transition:border-color var(--duration-fast) var(--easing-standard);
  }
  input:focus,select:focus,textarea:focus{border-color:var(--color-ring);outline:2px solid color-mix(in srgb,var(--color-ring) 25%,transparent);outline-offset:0}
  textarea{resize:vertical;line-height:var(--line-height-relaxed);font-family:var(--font-family-mono);font-size:var(--font-size-sm)}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--color-destructive)}
  .checkbox{display:flex;align-items:center;gap:var(--spacing-2);font-size:var(--font-size-sm)}
  .form-foot{display:flex;justify-content:flex-end;gap:var(--spacing-2);margin-top:var(--spacing-4)}
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--spacing-4)}

  .entrance-card{
    text-align:left;border:1px solid var(--color-border);background:var(--color-card);border-radius:var(--radius-md);
    padding:var(--spacing-4);cursor:pointer;display:flex;flex-direction:column;gap:var(--spacing-2);
    transition:border-color var(--duration-fast) var(--easing-standard),transform var(--duration-fast) var(--easing-standard);
  }
  .entrance-card:hover{border-color:var(--color-accent);transform:translateY(-1px)}
  .entrance-card .name{font-family:var(--font-family-heading);font-size:var(--font-size-md);font-weight:var(--font-weight-bold)}
  .entrance-card .purpose{font-size:var(--font-size-sm);color:var(--color-muted-foreground);min-height:38px}

  .checkline{display:flex;align-items:center;gap:var(--spacing-2);font-size:var(--font-size-sm);border:1px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--spacing-2) var(--spacing-3)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--color-success);display:inline-block}
  .dot.warn{background:var(--color-warning)}
  .dot.muted{background:var(--color-muted-foreground)}

  .placeholder-panel{max-width:720px;margin:var(--spacing-8) auto;text-align:center;display:flex;flex-direction:column;gap:var(--spacing-3);align-items:center}
  .placeholder-icon{width:56px;height:56px;border-radius:var(--radius-md);background:var(--color-muted);display:grid;place-items:center;font-family:var(--font-family-heading);font-weight:700;color:var(--color-muted-foreground)}

  /* ===== Session detail ===== */
  .detail-head{display:flex;flex-direction:column;gap:var(--spacing-1);margin-bottom:var(--spacing-4)}
  .detail-meta{font-size:var(--font-size-sm);color:var(--color-muted-foreground)}
  .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:var(--spacing-4);align-items:start}
  .timeline{display:flex;flex-direction:column}
  .event{display:grid;grid-template-columns:64px 1fr;gap:var(--spacing-3);padding:var(--spacing-3) 0;border-bottom:1px solid var(--color-border)}
  .event:last-child{border-bottom:0}
  .event-time{font-family:var(--font-family-mono);font-size:var(--font-size-xs);color:var(--color-muted-foreground)}
  .event-title{font-weight:var(--font-weight-medium);font-size:var(--font-size-sm)}
  .event-body{font-family:var(--font-family-mono);font-size:var(--font-size-xs);color:var(--color-muted-foreground);white-space:pre-wrap;margin-top:4px;overflow-wrap:anywhere}
  .event-actions{margin-top:var(--spacing-2);display:flex;gap:var(--spacing-2)}
  .tabs{display:flex;border-bottom:1px solid var(--color-border);margin-bottom:var(--spacing-3)}
  .tab{border:0;background:none;padding:8px 10px;cursor:pointer;font-size:var(--font-size-sm);color:var(--color-muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--color-foreground);border-bottom-color:var(--color-accent);font-weight:var(--font-weight-medium)}
  .counter{font-size:var(--font-size-xs);color:var(--color-muted-foreground);text-align:right;margin-top:4px}
  .counter.warn{color:var(--color-warning)}
  .counter.over{color:var(--color-destructive)}
  .dropzone{border:1px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--spacing-4);text-align:center;font-size:var(--font-size-sm);color:var(--color-muted-foreground)}
  .dropzone:hover{border-color:var(--color-accent)}
  .file-list{display:flex;flex-direction:column;gap:6px;margin-top:var(--spacing-2)}
  .file-row{display:flex;justify-content:space-between;gap:var(--spacing-2);font-size:var(--font-size-xs);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:6px 8px}
  .file-row.bad{border-color:var(--color-destructive);color:var(--color-destructive)}
  .artifact{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--spacing-3);background:var(--color-muted)}
  .artifact pre{margin:var(--spacing-2) 0 0;font-family:var(--font-family-mono);font-size:11px;color:var(--color-muted-foreground);white-space:pre-wrap;max-height:96px;overflow:auto}
  .call-result{border-radius:var(--radius-sm);padding:var(--spacing-3);font-size:var(--font-size-sm);margin-top:var(--spacing-3)}
  .call-result.ok{background:color-mix(in srgb,var(--color-success) 10%,transparent);border:1px solid color-mix(in srgb,var(--color-success) 40%,transparent)}
  .call-result.bad{background:color-mix(in srgb,var(--color-destructive) 10%,transparent);border:1px solid color-mix(in srgb,var(--color-destructive) 40%,transparent)}
  .readonly-note{border:1px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--spacing-3);font-size:var(--font-size-sm);color:var(--color-muted-foreground)}

  /* ===== Modal / toast / skeleton ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:100;padding:var(--spacing-4)}
  .modal{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);max-width:460px;width:100%;padding:var(--spacing-6)}
  .modal h3{margin:0 0 var(--spacing-2);font-size:var(--font-size-lg)}
  .modal ul{margin:var(--spacing-2) 0;padding-left:18px;font-size:var(--font-size-sm);color:var(--color-muted-foreground)}
  .modal-foot{display:flex;justify-content:flex-end;gap:var(--spacing-2);margin-top:var(--spacing-4)}
  .toast{position:fixed;right:var(--spacing-6);bottom:var(--spacing-6);background:var(--color-card);border:1px solid var(--color-border);border-left:4px solid var(--color-success);border-radius:var(--radius-md);padding:var(--spacing-3) var(--spacing-4);box-shadow:var(--shadow-lg);z-index:200;font-size:var(--font-size-sm);max-width:360px}
  .toast.error{border-left-color:var(--color-destructive)}
  .skeleton{background:var(--color-muted);border-radius:var(--radius-sm);height:14px;margin-bottom:var(--spacing-2);animation:pulse 1.4s ease-in-out infinite}
  .skeleton.card{height:96px}
  .skeleton.row{height:36px;margin-bottom:1px}
  .skeleton.title{height:28px;width:40%}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== Responsive ===== */
  @media (max-width:1024px){
    .detail-grid{grid-template-columns:1fr}
    .grid-entrances{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:768px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;transform:translateX(-100%);transition:transform var(--duration-base) var(--easing-standard)}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:inline-flex}
    .content{padding:var(--spacing-4)}
    .grid-entrances,.grid-2,.form-grid{grid-template-columns:1fr}
    .topbar{padding:0 var(--spacing-4)}
    .state-switch{display:none}
    .topbar-actions{flex-wrap:nowrap}
    .user-btn{padding:6px 8px}
    .page-sub{display:none}
    .login-card{padding:var(--spacing-6)}
  }

  /* ===== Auth / Login（US-011） ===== */
  #loginRoot{display:none}
  body:not(.authed) #loginRoot{display:block}
  body:not(.authed) .app{display:none}
  .login-shell{min-height:100vh;display:grid;place-items:center;padding:var(--spacing-6);background:var(--color-background);position:relative}
  .login-theme{position:absolute;top:var(--spacing-4);right:var(--spacing-4)}
  .login-card{width:100%;max-width:400px;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--spacing-8);box-shadow:var(--shadow-lg)}
  .login-brand{display:flex;align-items:center;gap:var(--spacing-2);font-family:var(--font-family-heading);font-weight:var(--font-weight-bold);margin-bottom:var(--spacing-6)}
  .login-title{font-family:var(--font-family-heading);font-size:var(--font-size-xl);margin:0 0 var(--spacing-1)}
  .login-sub{font-size:var(--font-size-sm);color:var(--color-muted-foreground);margin:0 0 var(--spacing-4)}
  .login-card .banner{margin-bottom:var(--spacing-4)}
  .login-submit{width:100%;margin-top:var(--spacing-2)}
  .login-foot{margin-top:var(--spacing-4);padding-top:var(--spacing-3);border-top:1px solid var(--color-border);line-height:var(--line-height-base)}
  .user-menu{position:relative}
  .user-btn{display:inline-flex;align-items:center;gap:6px}

<script>
(function(){

  /* ================= 数据 ================= */
  const ENTRANCES = [

    providerErrors:{}, providerTest:'idle', providerTestId:null, editingProvider:null,
    modelForm:false, selectedProvider:'pr1',
    modelDraft:{display:'',modelName:'',temp:'0.7',maxTokens:'2048',enabled:true}, modelErrors:{},
    projectMode:'edit', selectedProject:'p1',
    projectDraft:{name:'支付台',repo:'git@git.example.com:pay/checkout.git',stack:'Java 17, MySQL 8, Redis',source:'支付台 4.2 需求评审稿',notes:'核心链路：下单、支付回调'}, projectErrors:{},
    createOpen:false, createDraft:{projectId:'p1',modelId:'m1',title:''}, createErrors:{},
    tab:'text', sessionStatus:'进行中', currentSession:{id:'s1', title:'登录异常排查', projectId:'p1', model:'内网-快速'}, advanced:false, callState:'idle', callPrompt:'请分析以下登录报错的可能原因', composer:{title:'',body:''},
    uploadFiles:[], expandedCall:null, expandedEvent:null,
    filterProject:'all', filterStatus:'all',
    callFilter:{project:'all',session:'all',range:'7d'},
    /* US-011 登录：authed 为会话是否有效；pendingTarget 为登录后要回的页面 */
    authed:false,
    auth:{password:'',submitting:false,error:'',failures:0,lockUntil:0,notice:null,noticeKind:'info'},
    pendingTarget:null,
    authRestore:null,
    userMenu:false,
    sessions:[
      {id:'s1', title:'登录异常排查', projectId:'p1', entrance:'排查日志', model:'内网-快速', status:'进行中', updated:'3 分钟前'},
      {id:'s2', title:'支付回调用例补全', projectId:'p1', entrance:'用例库', model:'内网-快速', status:'已完成', updated:'昨天 18:20'},
      {id:'s3', title:'慢查询分析', projectId:'p2', entrance:'分析 SQL', model:'内网-长文', status:'失败', updated:'11-15 14:05'}
    ],
    projects:[
      {id:'p1', name:'支付台', repo:'git@git.example.com:pay/checkout.git', stack:'Java 17, MySQL 8, Redis', source:'支付台 4.2 需求评审稿', notes:'核心链路：下单、支付回调', updated:'2026-11-17 10:20'},
      {id:'p2', name:'风控台', repo:'git@git.example.com:risk/engine.git', stack:'Go 1.22, PostgreSQL', source:'风控规则 2.0 需求', notes:'规则命中与名单管理', updated:'2026-11-16 17:40'}
    ],
    providers:[
      {id:'pr1', name:'内网 AI 网关', protocol:'openai-compatible', baseUrl:'https://ai-gw.internal/v1', key:'sk-****8f3a', enabled:true, modelCount:12},
      {id:'pr2', name:'Anthropic 官方', protocol:'anthropic', baseUrl:'https://api.anthropic.com', key:'sk-ant-****c21d', enabled:false, modelCount:4}
    ],
    models:[
      {id:'m1', providerId:'pr1', modelName:'qwen-plus', display:'内网-快速', temp:0.7, maxTokens:2048, enabled:true},
      {id:'m2', providerId:'pr1', modelName:'qwen-max', display:'内网-长文', temp:0.7, maxTokens:8192, enabled:true},
      {id:'m3', providerId:'pr2', modelName:'claude-sonnet-4-5', display:'Claude Sonnet', temp:0.3, maxTokens:4096, enabled:true}
    ],
    events:[
      {time:'10:02', type:'input', title:'输入事件 · 报错日志', body:'前 3 行预览：\n2026-11-17 09:58:12 ERROR login failed: token expired\n2026-11-17 09:58:19 WARN retry 1/3', full:'2026-11-17 09:58:12 ERROR login failed: token expired\n2026-11-17 09:58:19 WARN retry 1/3\n2026-11-17 09:58:25 INFO auth service reachable\n2026-11-17 09:58:30 ERROR login failed: token expired'},
      {time:'10:03', type:'call', ok:true, title:'调用记录 · 内网-快速', meta:'成功 · 8.4s · 重试 0', digest:'提示摘要：请分析以下登录报错…', result:'建议按以下顺序排查：\n1. 检查 access token 是否在网关侧被提前过期；\n2. 核对客户端刷新 token 的时钟偏移；\n3. 复现时抓取 401 响应头。'},
      {time:'10:04', type:'artifact', title:'制品事件 · app.log', meta:'12.4 KB · 前 20 行可预览', renamed:null},
      {time:'10:05', type:'call', ok:false, title:'调用记录 · 内网-快速', meta:'失败 · 120s · 重试 1', digest:'提示摘要：请分析以下登录报错…', error:'401 Unauthorized：密钥无效或已过期'}
    ],
    calls:[
      {time:'11-17 10:03', session:'登录异常排查', project:'支付台', model:'内网-快速', status:'成功', latency:'8.4s', retry:0, digest:'请分析以下登录报错…'},
      {time:'11-17 10:05', session:'登录异常排查', project:'支付台', model:'内网-快速', status:'失败', latency:'120s', retry:1, digest:'请分析以下登录报错…', error:'401 Unauthorized：密钥无效或已过期'},
      {time:'11-16 18:12', session:'支付回调用例补全', project:'支付台', model:'内网-快速', status:'成功', latency:'5.1s', retry:0, digest:'根据以下需求生成用例…'}
    ],
  };

  const PAGE_META = {
    home:{title:'工作台首页', sub:'6 个入口与最近会话'},
    entrance:{title:'入口页', sub:'占位或真实功能页'},
    providers:{title:'AI 提供商与模型', sub:'密钥掩码 · 连接测试 10s 超时'},
    models:{title:'模型绑定', sub:'默认参数与启用状态'},
    projects:{title:'项目上下文', sub:'项目名全局唯一'},
    sessions:{title:'分析会话', sub:'创建、筛选与删除'},
    session:{title:'会话详情', sub:'时间线 · 输入 · 调用 · 制品'},
    calls:{title:'AI 调用记录', sub:'按会话、项目与时间查询'}
  };

  const UI_STATES = [
    {id:'default', label:'默认'},
    {id:'loading', label:'加载'},
    {id:'success', label:'成功'},
    {id:'error', label:'错误'},
    {id:'empty', label:'空态'}
  ];

  /* ================= 工具 ================= */
  const $ = (sel, root) => (root || document).querySelector(sel);
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function projectName(id){ const p = state.projects.find(x => x.id === id); return p ? p.name : '未绑定项目'; }
  function providerName(id){ const p = state.providers.find(x => x.id === id); return p ? p.name : '未知提供商'; }
  function badgeFor(status){
    if(status === '进行中') return '<span class="badge badge-info">进行中</span>';
    if(status === '已完成') return '<span class="badge badge-success">已完成</span>';
    if(status === '失败') return '<span class="badge badge-danger">失败</span>';
    if(status === '计划中') return '<span class="badge badge-muted">计划中</span>';
    if(status === '已接入') return '<span class="badge badge-success">已接入</span>';
    if(status === '成功') return '<span class="badge badge-success">成功</span>';
    return '<span class="badge badge-muted">' + esc(status) + '</span>';
  }
  function banner(kind, text){ return '<div class="banner banner-' + kind + '">' + esc(text) + '</div>'; }
  function emptyState(title, desc, cta){
    return '<div class="empty-cell"><div class="h2">' + esc(title) + '</div><div class="muted small" style="margin-bottom:12px">' + esc(desc) + '</div>' + (cta || '') + '</div>';
  }
  function errorState(title, desc, retry){
    return '<div class="empty-cell"><div class="h2">' + esc(title) + '</div><div class="muted small" style="margin-bottom:12px">' + esc(desc) + '</div>' + (retry ? '<button class="btn" data-action="retry">重试</button>' : '') + '</div>';
  }
  function skeletonRows(n){
    let out = '<div class="skeleton title"></div>';
    for(let i = 0; i < (n || 5); i++) out += '<div class="skeleton row"></div>';
    return out;
  }
  function toast(msg, kind){
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'error' ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
  function readOnly(){ return state.sessionStatus !== '进行中'; }

  /* ================= 登录（US-011） ================= */
  const DEMO_PASSWORD = 'aw-ux-2026';
  const MAX_FAILURES = 5;
  const LOCK_MS = 5 * 60 * 1000;
  let lockTimer = null;

  function fmtRemain(ms){
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }
  function authLocked(){ return state.auth.lockUntil > Date.now(); }
  function ensureLockTimer(){
    if(lockTimer) return;
    lockTimer = setInterval(function(){
      if(state.authed || !state.auth.lockUntil){ clearInterval(lockTimer); lockTimer = null; return; }
      if(Date.now() >= state.auth.lockUntil){
        state.auth.lockUntil = 0; state.auth.failures = 0; state.auth.error = '';
        clearInterval(lockTimer); lockTimer = null; render(); return;
      }
      const el = $('#lockRemaining');
      if(el) el.textContent = fmtRemain(state.auth.lockUntil - Date.now());
    }, 1000);
  }

  function renderLogin(){
    const a = state.auth, locked = authLocked();
    let alerts = '';
    if(a.notice) alerts += banner(a.noticeKind || 'info', a.notice);
    if(a.error) alerts += banner('error', a.error);
    if(locked) alerts += '<div class="banner banner-error" role="alert">尝试次数过多，登录已锁定。请在 <span class="mono" id="lockRemaining">' + fmtRemain(a.lockUntil - Date.now()) + '</span> 后重试。</div>';
    $('#loginRoot').innerHTML =
      '<div class="login-shell">' +
        '<div class="login-theme"><button class="icon-btn" data-action="toggle-theme" aria-label="切换主题">' + (state.theme === 'dark' ? '浅色' : '深色') + '</button></div>' +
        '<div class="login-card" role="main" aria-labelledby="loginTitle">' +
          '<div class="login-brand"><span class="brand-mark">AW</span><span>AI Test Workbench</span></div>' +
          '<h1 class="login-title" id="loginTitle">登录工作台</h1>' +
          '<p class="login-sub">输入部署时设置的管理员口令，登录后才能访问工作台页面。</p>' +
          alerts +
          '<form id="loginForm" novalidate>' +
            '<div class="field"><label for="adminPassword">管理员口令</label>' +
            '<input id="adminPassword" type="password" autocomplete="current-password" value="' + esc(a.password) + '"' + (locked ? ' disabled' : '') + ' aria-describedby="pwdHint">' +
            '<span class="hint" id="pwdHint">口令由部署环境变量 AW_ADMIN_PASSWORD 提供；不会明文回显，也不会写入日志。</span></div>' +
            '<button class="btn btn-primary login-submit" type="submit" id="loginSubmit"' + (locked || a.submitting ? ' disabled' : '') + '>' + (a.submitting ? '登录中…' : '登录') + '</button>' +
          '</form>' +
          '<div class="login-foot small muted">仅交互演示：<button class="link" data-action="fill-demo-password">填入演示口令</button>。产品界面不显示任何口令；未设置口令时服务不会启动，因此登录页不提供注册或找回口令。</div>' +
        '</div>' +
      '</div>';
    if(locked) ensureLockTimer();
    const inp = $('#adminPassword');
    if(inp && !locked && (!document.activeElement || document.activeElement === document.body)) inp.focus();
  }

  function submitLogin(){
    const a = state.auth;
    if(state.authed || a.submitting || authLocked()) return;
    if(!a.password){ a.error = '请输入管理员口令'; render(); return; }
    a.submitting = true; a.error = ''; a.notice = null; render();
    setTimeout(function(){
      if(state.auth.password === DEMO_PASSWORD){ finishLogin(); return; }
      state.auth.failures += 1;
      state.auth.submitting = false;
      if(state.auth.failures >= MAX_FAILURES){
        state.auth.lockUntil = Date.now() + LOCK_MS;
        state.auth.password = '';
        state.auth.error = '';
      } else {
        state.auth.error = '口令错误，请重试。';
      }
      render();
    }, 600);
  }

  function authSnapshot(){
    return {
      page: state.page,
      extra: state.page === 'session' ? {sessionId: state.currentSession.id} : state.page === 'entrance' ? {entrance: state.entrance} : {},
      composer: {title: state.composer.title, body: state.composer.body},
      callPrompt: state.callPrompt,
      providerForm: state.providerForm, providerDraft: Object.assign({}, state.providerDraft),
      modelForm: state.modelForm, modelDraft: Object.assign({}, state.modelDraft),
      projectDraft: Object.assign({}, state.projectDraft),
      createOpen: state.createOpen, createDraft: Object.assign({}, state.createDraft)
    };
  }
  function applyRestore(r){
    if(!r) return;
    state.pendingTarget = {page: r.page, extra: r.extra || {}};
    state.composer = r.composer || state.composer;
    state.callPrompt = r.callPrompt;
    state.providerForm = r.providerForm; state.providerDraft = r.providerDraft;
    state.modelForm = r.modelForm; state.modelDraft = r.modelDraft;
    state.projectDraft = r.projectDraft;
    state.createOpen = r.createOpen; state.createDraft = r.createDraft;
    state.tab = 'text';
  }

  function finishLogin(){
    const restore = state.authRestore;
    state.authRestore = null;
    state.auth = {password:'',submitting:false,error:'',failures:0,lockUntil:0,notice:null,noticeKind:'info'};
    state.authed = true;
    applyRestore(restore);
    const target = state.pendingTarget || {page:'home', extra:{}};
    state.pendingTarget = null;
    state.notice = restore
      ? {kind:'info', text:'已登录，已恢复上次填写但未提交的内容'}
      : {kind:'success', text:'已登录'};
    go(target.page, target.extra || {});
  }

  function logout(){
    state.authed = false;
    state.authRestore = null;
    state.pendingTarget = {page:'home', extra:{}};
    state.userMenu = false;
    state.composer = {title:'', body:''};
    state.callPrompt = '';
    state.createOpen = false;
    state.providerForm = false;
    state.modelForm = false;
    state.auth = {password:'',submitting:false,error:'',failures:state.auth.failures,lockUntil:state.auth.lockUntil,notice:'已退出登录。',noticeKind:'info'};
    render();
  }

  function expireSession(){
    if(!state.authed) return;
    state.authRestore = authSnapshot();
    state.authed = false;
    state.userMenu = false;
    state.auth = {password:'',submitting:false,error:'',failures:state.auth.failures,lockUntil:state.auth.lockUntil,
      notice:'会话已过期，请重新登录。已填写但未提交的内容已保留，重新登录后会恢复。', noticeKind:'info'};
    render();
  }

  function parseInitialTarget(){
    const h = (location.hash || '').replace(/^#/, '');
    if(!h) return null;
    if(h.indexOf('session/') === 0) return {page:'session', extra:{sessionId:h.slice(8)}};
    const pages = ['home','entrance','providers','models','projects','sessions','session','calls'];
    if(pages.indexOf(h) < 0) return null;
    return {page:h, extra:h === 'entrance' ? {entrance:'log-triage'} : h === 'session' ? {sessionId:'s1'} : {}};
  }

  /* ================= 页面 ================= */
  function renderHome(){
    const s = state.ui;
    const enabledModels = state.models.filter(m => m.enabled && (state.providers.find(p => p.id === m.providerId) || {}).enabled);
    const ready = state.projects.length > 0 && enabledModels.length > 0;
    let html = '<div class="spread" style="margin-bottom:var(--spacing-6)"><div><h2 class="h1">开始一次分析</h2><p class="muted" style="margin:0">选项目 → 给输入 → 发起调用，三步拿到 AI 结果。</p></div></div>';

    if(s === 'loading'){
      html += '<div class="skeleton title"></div><div class="grid grid-entrances" style="margin:16px 0 32px">' + '<div class="skeleton card"></div><div class="skeleton card"></div><div class="skeleton card"></div>' + '</div><div class="skeleton title"></div>' + skeletonRows(5);
      return html;
    }
    if(s === 'error') html += banner('error','最近会话加载失败：请求超时。入口区仍可使用，可稍后重试。');
    if(s === 'success') html += banner('success','首页数据已同步 · 最近会话 3 条');

    html += '<div class="checkline" style="margin-bottom:var(--spacing-4)">' +
      (ready
        ? '<span class="dot"></span><span>前置检查通过：' + state.projects.length + ' 个项目 · ' + enabledModels.length + ' 个启用模型</span>'

      '<div class="detail-head"><div class="spread" style="justify-content:flex-start"><h2 class="h1" style="margin:0">' + esc(cs.title) + '</h2>' + badgeFor(state.sessionStatus) +

      '<div class="detail-meta">项目：' + esc(sessionProject) + ' · 入口：排查日志 · 模型：' + esc(cs.model) + '</div></div>';

    if(s === 'loading') return html + '<div class="detail-grid"><div class="card">' + skeletonRows(5) + '</div><div class="card">' + skeletonRows(3) + '</div></div>';
    if(s === 'error') html += banner('error','发起调用失败：401 Unauthorized（密钥无效或已过期），已自动重试 1 次。');
    if(s === 'success') html += banner('success','调用完成 · 结果已写入时间线，并记录本次 AiCallRecord');

    html += '<div class="detail-grid">';

    /* 时间线 */
    html += '<div class="card"><div class="spread" style="margin-bottom:8px"><div class="h2">时间线</div><span class="small muted">按发生顺序</span></div>';
    if(s === 'empty' || !state.events.length){
      html += emptyState('会话还没有内容','先粘贴一段文本或上传日志，再发起调用。','<button class="btn" data-action="focus-composer">去添加输入</button>');
    } else {
      html += '<div class="timeline">' + state.events.map((ev, idx) => {
        if(ev.type === 'call'){
          const open = state.expandedEvent === idx;
          return '<div class="event"><div class="event-time">' + esc(ev.time) + '</div><div>' +
            '<div class="spread" style="justify-content:flex-start"><span class="event-title">' + esc(ev.title) + '</span>' + (ev.ok ? '<span class="badge badge-success">成功</span>' : '<span class="badge badge-danger">失败</span>') + '</div>' +
            '<div class="event-body">' + esc(ev.meta) + '\n' + esc(ev.digest || '') + (ev.error && open ? '\n错误：' + esc(ev.error) : '') + '</div>' +
            (ev.result ? '<div class="artifact" style="margin-top:8px"><div class="small muted">调用结果</div><pre>' + esc(ev.result) + '</pre></div>' : '') +
            (ev.error ? '<div class="event-actions"><button class="btn btn-sm" data-action="toggle-event" data-idx="' + idx + '">' + (open ? '收起错误信息' : '展开错误信息') + '</button></div>' : '') +
            '</div></div>';
        }
        if(ev.type === 'artifact'){
          return '<div class="event"><div class="event-time">' + esc(ev.time) + '</div><div>' +
            '<div class="event-title">' + esc(ev.title) + '</div>' +
            '<div class="artifact" style="margin-top:8px"><div class="spread"><span class="mono small">' + esc(ev.title.replace('制品事件 · ','')) + '</span><span class="small muted">' + esc(ev.meta) + '</span></div>' +
            (ev.renamed ? '<div class="small" style="color:var(--color-warning)">已自动改名为 ' + esc(ev.renamed) + '</div>' : '') +
            '<pre>2026-11-17 09:58:12 ERROR login failed: token expired\n2026-11-17 09:58:19 WARN retry 1/3\n2026-11-17 09:58:25 INFO auth service reachable</pre>' +
            '<div class="row" style="margin-top:8px"><button class="btn btn-sm">预览</button><button class="btn btn-sm">下载</button></div></div></div></div>';
        }
        if(ev.type === 'status'){
          return '<div class="event"><div class="event-time">' + esc(ev.time) + '</div><div>' +
            '<div class="spread" style="justify-content:flex-start"><span class="event-title">' + esc(ev.title) + '</span><span class="badge badge-muted">状态变更</span></div>' +
            '<div class="event-body">' + esc(ev.body) + '</div></div></div>';
        }
        const full = ev.full || ev.body;
        const open = state.expandedEvent === idx;
        const preview = full.split('\n').slice(0, 3).join('\n');
        return '<div class="event"><div class="event-time">' + esc(ev.time) + '</div><div><div class="event-title">' + esc(ev.title) + '</div>' +
          '<div class="event-body">' + esc(open ? full : preview) + '</div>' +
          (full !== preview ? '<div class="event-actions"><button class="btn btn-sm" data-action="toggle-event" data-idx="' + idx + '">' + (open ? '收起' : '展开全文') + '</button></div>' : '') +
          '</div></div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    /* 右侧面板 */
    html += '<div class="card">';
    if(readOnly()){
      html += '<div class="readonly-note">会话已结束，不再接受新输入。状态：' + badgeFor(state.sessionStatus) + '</div>';
    } else {
      html += '<div class="tabs" role="tablist">' +
        '<button class="tab' + (state.tab === 'text' ? ' active' : '') + '" data-action="tab" data-tab="text">文本粘贴</button>' +
        '<button class="tab' + (state.tab === 'upload' ? ' active' : '') + '" data-action="tab" data-tab="upload">上传文件</button>' +
        '<button class="tab' + (state.tab === 'call' ? ' active' : '') + '" data-action="tab" data-tab="call">发起调用</button>' +
        '</div>';
      if(state.tab === 'text') html += composerPanel();
      if(state.tab === 'upload') html += uploadPanel();
      if(state.tab === 'call') html += callPanel();
    }
    html += '</div></div>';
    return html;
  }

  function composerPanel(){
    return '<div class="field"><label>标题（可选）</label><input type="text" data-field="composer.title" value="' + esc(state.composer.title) + '" placeholder="例如：报错日志"></div>' +
      '<div class="field"><label>正文（必填）</label><textarea id="composerBody" rows="9" data-field="composer.body" placeholder="粘贴需求、报错或 SQL…">' + esc(state.composer.body) + '</textarea>' +
      '<div class="counter" id="counter">已输入 0 / 200,000 字符</div></div>' +
      '<button class="btn btn-accent" style="width:100%" data-action="add-text" id="addTextBtn">添加到时间线</button>';
  }

  function uploadPanel(){
    const list = state.uploadFiles;
    let html = '<label class="dropzone" for="fileInput">拖拽文件到这里，或点击选择<br><span class="small">允许 .txt .md .markdown .log .json .yaml .yml .csv .sql；单文件 ≤10MB；单次 ≤10 个</span></label>' +
      '<input id="fileInput" type="file" multiple accept=".txt,.md,.markdown,.log,.json,.yaml,.yml,.csv,.sql" style="display:none">';
    if(list.length){
      html += '<div class="file-list">' + list.map((f,i) =>
        '<div class="file-row' + (f.error ? ' bad' : '') + '"><span>' + esc(f.name) + ' <span class="muted">' + f.sizeText + '</span></span><span>' + (f.error ? esc(f.error) : '<span class="badge badge-success">可上传</span>') + ' <button class="link" data-action="remove-file" data-idx="' + i + '">移除</button></span></div>'
      ).join('') + '</div>';
    }
    const hasBad = list.some(f => f.error);
    html += '<button class="btn btn-accent" style="width:100%;margin-top:12px" data-action="submit-upload" ' + (list.length === 0 || hasBad ? 'disabled' : '') + '>上传到会话</button>';
    return html;
  }

  function callPanel(){
    const ctx = state.events.map((ev, i) => ({ev, i})).filter(x => x.ev.type === 'input' || x.ev.type === 'artifact');
    const ctxHtml = ctx.length
      ? ctx.map(x => '<label class="checkbox"><input type="checkbox" checked> ' + esc(x.ev.title) + '（' + esc(x.ev.time) + '）</label>').join('')
      : '<div class="hint">时间线还没有可引用的输入事件或制品；本次调用仅使用提示文本。</div>';
    const n = state.callPrompt.length;
    const over = n > 200000;
    const counterCls = over ? ' over' : n > 180000 ? ' warn' : '';
    let html = '<div class="field"><label>提示（必填）</label><textarea id="callPromptInput" rows="5" data-field="callPrompt" placeholder="例如：请分析以下登录报错的可能原因">' + esc(state.callPrompt) + '</textarea>' +
      '<div class="counter' + counterCls + '" id="promptCounter">已输入 ' + n.toLocaleString('en-US') + ' / 200,000 字符' + (over ? ' · 超出 ' + (n - 200000).toLocaleString('en-US') + ' 字符，请删减后再发起' : '') + '</div>' +
      '<span class="hint">必填；将作为本次调用的提示，摘要与错误信息不含密钥。</span></div>' +
      '<div class="field"><label>引用上下文</label>' + ctxHtml + '</div>';

    if(over){
      html += '<div class="call-result bad"><strong>已超出上限，不会截断</strong><div class="small" style="margin-top:4px">当前 ' + n.toLocaleString('en-US') + ' 字符，上限 200,000 字符，请删减后再发起。</div></div>';
    }

    html += '<button class="link" data-action="toggle-advanced">' + (state.advanced ? '收起高级参数' : '高级参数（本次覆盖）') + '</button>';
    if(state.advanced){
      html += '<div class="card" style="margin-top:8px;background:var(--color-muted)"><div class="form-grid">' +
        '<div class="field"><label>temperature</label><input type="number" step="0.1" value="0.7"><span class="hint">模型默认 0.7</span></div>' +
        '<div class="field"><label>max_tokens</label><input type="number" value="2048"><span class="hint">模型默认 2048</span></div>' +
        '</div><div class="small muted">仅本次调用生效，不改变模型默认参数。</div></div>';
    }
    html += '<button class="btn btn-accent" style="width:100%;margin-top:12px" data-action="run-call" id="runCallBtn" ' + (state.callState === 'loading' || !state.callPrompt.trim() || over ? 'disabled' : '') + '>' + (state.callState === 'loading' ? '调用中… 最长 120s' : '发起调用') + '</button>';
    if(state.callState === 'ok') html += '<div class="call-result ok"><strong>调用成功 · 8.4s · 重试 0</strong><div class="small muted" style="margin-top:4px">结果已追加到时间线，并写入 AiCallRecord。</div></div>';
    if(state.callState === 'bad') html += '<div class="call-result bad"><strong>调用失败 · 120s · 重试 1</strong><div class="small" style="margin-top:4px">401 Unauthorized：密钥无效或已过期。未自动切换模型。</div></div>';
    return html;
  }

  function renderCalls(){
    const s = state.ui;
    const f = state.callFilter;
    let list = state.calls.slice();
    if(f.project !== 'all') list = list.filter(c => c.project === f.project);
    if(f.session !== 'all') list = list.filter(c => c.session === f.session);
    let html = '<div class="spread" style="margin-bottom:var(--spacing-4)"><div><div class="h2">调用记录</div><div class="muted small">成功与失败调用都会留痕；摘要与错误信息不含密钥。</div></div></div>' +
      '<div class="row" style="margin-bottom:var(--spacing-3)">' +
      '<select data-field="callFilter.project" style="width:160px"><option value="all">全部项目</option>' + state.projects.map(p => '<option value="' + p.name + '"' + (f.project === p.name ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
      '<select data-field="callFilter.session" style="width:180px"><option value="all">全部会话</option>' + state.sessions.filter(x => f.project === 'all' || projectName(x.projectId) === f.project).map(x => '<option value="' + esc(x.title) + '"' + (f.session === x.title ? ' selected' : '') + '>' + esc(x.title) + '</option>').join('') + '</select>' +
      '<select data-field="callFilter.range" style="width:150px">' + [['today','今天'],['7d','近 7 天'],['30d','近 30 天'],['custom','自定义']].map(r => '<option value="' + r[0] + '"' + (f.range === r[0] ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select>' +
      '<span class="small muted" style="margin-left:auto">共 ' + list.length + ' 条</span></div>';

    if(s === 'loading') return html + '<div class="table-wrap" style="padding:16px">' + skeletonRows(4) + '</div>';
    if(s === 'error') return html + '<div class="table-wrap">' + errorState('调用记录查询失败','筛选条件已保留，请重试。', true) + '</div>';
    if(s === 'success') html += banner('success','已按当前筛选加载调用记录');
    if(s === 'empty' || !list.length){
      return html + '<div class="table-wrap">' + emptyState('该条件下没有调用记录','换个时间范围或清除筛选试试。','<button class="btn" data-action="clear-call-filters">清除筛选</button>') + '</div>';
    }
    html += '<div class="table-wrap"><table><thead><tr><th>时间</th><th>会话</th><th>模型</th><th>状态</th><th>耗时</th><th>重试</th><th>提示摘要</th><th></th></tr></thead><tbody>' +
      list.map((c,i) => '<tr><td class="mono small">' + esc(c.time) + '</td><td>' + esc(c.session) + '</td><td class="small">' + esc(c.model) + '</td><td>' + badgeFor(c.status) + '</td><td>' + esc(c.latency) + '</td><td>' + c.retry + '</td><td class="small muted">' + esc(c.digest) + '</td><td><button class="btn btn-sm" data-action="expand-call" data-idx="' + i + '">' + (state.expandedCall === i ? '收起' : '核对') + '</button></td></tr>' +
        (state.expandedCall === i ? '<tr><td colspan="8" class="small" style="background:var(--color-muted)">调用编号 call-' + String(i + 1).padStart(4,'0') + ' · 模型 ' + esc(c.model) + ' · 状态 ' + esc(c.status) + ' · 耗时 ' + esc(c.latency) + ' · 重试 ' + c.retry + ' · 提示摘要 ' + esc(c.digest) + (c.error ? ' · 错误信息：' + esc(c.error) : '') + '</td></tr>' : '')).join('') +
      '</tbody></table></div>';
    return html;
  }

  const RENDERERS = {
    home:renderHome, entrance:renderEntrance, providers:renderProviders, models:renderModels,
    projects:renderProjects, sessions:renderSessions, session:renderSession, calls:renderCalls
  };

  /* ================= 渲染 ================= */
  function render(){
    document.body.classList.toggle('authed', !!state.authed);
    if(!state.authed){
      const old = $('#modalRoot'); if(old) old.remove();
      renderLogin();
      return;
    }
    const loginRoot = $('#loginRoot'); if(loginRoot) loginRoot.innerHTML = '';
    const meta = PAGE_META[state.page] || PAGE_META.home;
    $('#pageTitle').textContent = meta.title;
    $('#pageSub').textContent = meta.sub;
    $('#themeBtn').textContent = state.theme === 'dark' ? '浅色' : '深色';
    $('#stateSwitch').innerHTML = UI_STATES.map(x => '<button data-ui="' + x.id + '" class="' + (state.ui === x.id ? 'active' : '') + '">' + x.label + '</button>').join('');
    document.querySelectorAll('.nav-item').forEach(el => {
      const nav = el.dataset.nav;
      const sameEntrance = nav === 'entrance' && el.dataset.entrance === state.entrance;
      el.classList.toggle('active', nav === state.page && (nav !== 'entrance' || sameEntrance));
    });
    const view = $('#view');
    view.innerHTML = (state.notice ? banner(state.notice.kind, state.notice.text) : '') + (RENDERERS[state.page] || renderHome)();
    state.notice = null;
    if(state.page === 'session' && state.tab === 'text') updateCounter();
    $('#sidebar').classList.toggle('open', state.navOpen);
    const pop = $('#userPop'), userBtn = $('#userBtn');
    if(pop) pop.hidden = !state.userMenu;
    if(userBtn) userBtn.setAttribute('aria-expanded', state.userMenu ? 'true' : 'false');
  }

  function updateCounter(){
    const ta = $('#composerBody'), c = $('#counter'), btn = $('#addTextBtn');
    if(!ta || !c || !btn) return;
    const n = ta.value.length;
    c.textContent = '已输入 ' + n.toLocaleString('en-US') + ' / 200,000 字符';
    c.className = 'counter' + (n > 200000 ? ' over' : n > 180000 ? ' warn' : '');
    const empty = ta.value.trim().length === 0;
    btn.disabled = empty || n > 200000;
    if(n > 200000) c.textContent += ' · 超出 ' + (n - 200000).toLocaleString('en-US') + ' 字符，请删减后再提交';
  }

  function go(page, extra){
    if(!state.authed){
      state.pendingTarget = {page:page, extra:extra || {}};
      render();
      return;
    }
    state.page = page;
    state.navOpen = false;
    if(extra){
      Object.assign(state, extra);
      if(extra.sessionId){
        const s = state.sessions.find(x => x.id === extra.sessionId);
        if(s){
          state.currentSession = {id:s.id, title:s.title, projectId:s.projectId, model:s.model};
          state.sessionStatus = s.status;
          state.callState = 'idle';
          state.tab = 'text';
          state.expandedEvent = null;
        }
      }
    }
    if(page !== 'sessions') state.createOpen = false;
    if(page !== 'providers'){ state.providerTestId = null; state.providerTest = 'idle'; }
    render();
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function(e){
    const nav = e.target.closest('[data-nav]');
    if(nav && !e.target.closest('[data-action]')){
      e.preventDefault();
      const extra = {};
      if(nav.dataset.entrance) extra.entrance = nav.dataset.entrance;
      if(nav.dataset.session) extra.sessionId = nav.dataset.session;
      go(nav.dataset.nav, extra);
      return;
    }
    const ui = e.target.closest('[data-ui]');
    if(ui){ state.ui = ui.dataset.ui; render(); return; }

    const act = e.target.closest('[data-action]');
    if(!act) return;
    if(act.classList.contains('overlay') && e.target !== act) return;
    const action = act.dataset.action;
    const id = act.dataset.id;

    switch(action){
      case 'toggle-theme':
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', state.theme);
        render();
        break;
      case 'toggle-nav':
        state.navOpen = !state.navOpen; render(); break;
      case 'toggle-user-menu':
        state.userMenu = !state.userMenu; render(); break;
      case 'logout':
        logout(); break;
      case 'simulate-expiry':
        expireSession(); break;
      case 'fill-demo-password':
        state.auth.password = DEMO_PASSWORD; state.auth.error = ''; render(); break;
      case 'retry':
        state.ui = 'success';
        state.notice = {kind:'success', text:'重新加载成功'};
        render(); break;
      case 'clear-filters':
        state.filterProject = 'all'; state.filterStatus = 'all'; state.ui = 'default'; render(); break;
      case 'clear-call-filters':
        state.callFilter = {project:'all',session:'all',range:'7d'}; state.ui = 'default'; render(); break;

      /* 提供商 */
      case 'open-provider-form':
        state.providerForm = true; state.editingProvider = null; state.providerErrors = {};
        state.providerDraft = {name:'',protocol:'openai-compatible',baseUrl:'',key:'',enabled:true};
        state.providerTest = 'idle'; render(); break;
      case 'cancel-provider-form':
        state.providerForm = false; state.providerErrors = {}; render(); break;
      case 'open-models': state.selectedProvider = id; state.modelForm = false; state.modelErrors = {}; go('models'); break;
      case 'edit-provider': {
        const p = state.providers.find(x => x.id === id);
        state.providerForm = true; state.editingProvider = p;
        state.providerDraft = {name:p.name, protocol:p.protocol, baseUrl:p.baseUrl, key:'', enabled:p.enabled};
        state.providerErrors = {}; state.providerTest = 'idle'; render(); break;
      }
      case 'save-provider': {
        const d = state.providerDraft, err = {};
        if(!d.name.trim()) err.name = '请填写提供商名称';
        if(!/^https?:\/\//i.test(d.baseUrl.trim())) err.baseUrl = 'baseURL 必须以 http:// 或 https:// 开头';
        if(!state.editingProvider && !d.key.trim()) err.key = '请填写 API 密钥';
        state.providerErrors = err;
        if(Object.keys(err).length){ state.ui = 'error'; render(); break; }
        const masked = d.key ? '••••' + d.key.slice(-4) : (state.editingProvider ? state.editingProvider.key : '••••');
        if(state.editingProvider){
          Object.assign(state.editingProvider, {name:d.name, protocol:d.protocol, baseUrl:d.baseUrl, enabled:d.enabled, key:masked});
        } else {
          state.providers.push({id:'pr' + Date.now(), name:d.name, protocol:d.protocol, baseUrl:d.baseUrl, key:masked, enabled:d.enabled, modelCount:0});
        }
        state.providerForm = false; state.editingProvider = null; state.ui = 'success'; render(); break;
      }
      case 'test-provider':
      case 'test-provider-form': {
        state.providerTestId = action === 'test-provider' ? id : null;
        state.providerTest = 'testing'; render();
        setTimeout(() => {
          state.providerTest = state.ui === 'error' ? 'auth' : 'success';
          render();
        }, 900);
        break;
      }
      case 'toggle-provider': {
        const p = state.providers.find(x => x.id === id);
        if(p.enabled){
          openConfirm('停用提供商？','停用后该提供商下的模型不再可选为调用目标，历史调用记录仍可查询。','停用',() => {
            p.enabled = false; state.ui = 'success'; state.notice = {kind:'success', text:'提供商已停用'}; render();
          }, false);
        } else { p.enabled = true; state.ui = 'success'; render(); }
        break;
      }

      /* 模型 */
      case 'open-model-form': state.modelForm = true; state.modelErrors = {}; state.modelDraft = {display:'',modelName:'',temp:'0.7',maxTokens:'2048',enabled:true}; render(); break;
      case 'cancel-model-form': state.modelForm = false; render(); break;
      case 'save-model': {
        const d = state.modelDraft, err = {};
        const t = Number(d.temp);
        if(!(t >= 0 && t <= 2)) err.temp = '温度需在 0–2 之间';
        if(!/^[1-9]\d*$/.test(String(d.maxTokens))) err.maxTokens = 'max_tokens 必须为正整数';
        if(state.models.some(m => m.providerId === state.selectedProvider && m.modelName === d.modelName.trim())) err.modelName = '同一提供商下已存在模型 ' + d.modelName;
        state.modelErrors = err;
        if(Object.keys(err).length){ state.ui = 'error'; render(); break; }
        state.models.push({id:'m' + Date.now(), providerId:state.selectedProvider, modelName:d.modelName.trim(), display:d.display || d.modelName, temp:t, maxTokens:Number(d.maxTokens), enabled:d.enabled});
        state.modelForm = false; state.ui = 'success'; render(); break;
      }
      case 'toggle-model': {
        const m = state.models.find(x => x.id === id); m.enabled = !m.enabled; render(); break;
      }

      /* 项目 */
      case 'new-project':
        state.projectMode = 'create'; state.selectedProject = null;
        state.projectDraft = {name:'',repo:'',stack:'',source:'',notes:''}; state.projectErrors = {};
        state.ui = 'default'; render(); break;
      case 'select-project': {
        const p = state.projects.find(x => x.id === id);
        state.selectedProject = id; state.projectMode = 'edit';
        state.projectDraft = {name:p.name,repo:p.repo,stack:p.stack,source:p.source,notes:p.notes};
        state.projectErrors = {}; render(); break;
      }
      case 'reset-project': {
        if(state.projectMode === 'create'){ state.projectMode = 'edit'; }
        const p = state.projects.find(x => x.id === state.selectedProject) || state.projects[0];
        if(p){ state.selectedProject = p.id; state.projectDraft = {name:p.name,repo:p.repo,stack:p.stack,source:p.source,notes:p.notes}; }
        state.projectErrors = {}; render(); break;
      }
      case 'save-project': {
        const d = state.projectDraft, err = {};
        if(!d.name.trim()) err.name = '请填写项目名';
        else if(state.projects.some(p => p.name === d.name.trim() && p.id !== state.selectedProject)) err.name = '项目名已存在，请换一个名称';
        state.projectErrors = err;
        if(Object.keys(err).length){ state.ui = 'error'; render(); break; }
        const now = '2026-11-17 19:20';
        if(state.projectMode === 'create'){
          const p = {id:'p' + Date.now(), ...d, name:d.name.trim(), updated:now};
          state.projects.push(p); state.selectedProject = p.id; state.projectMode = 'edit';
        } else {
          const p = state.projects.find(x => x.id === state.selectedProject);
          Object.assign(p, d, {name:d.name.trim(), updated:now});
        }
        state.ui = 'success'; render(); break;
      }

      /* 会话 */
      case 'open-create':
        state.createOpen = true; state.createErrors = {};
        state.createDraft = {projectId:(state.projects[0]||{}).id || '', modelId:(state.models.find(m => m.enabled)||{}).id || '', title:''};
        render(); break;
      case 'close-create': state.createOpen = false; render(); break;
      case 'close-create-overlay':
        if(e.target === act){ state.createOpen = false; render(); }
        break;
      case 'save-session': {
        const d = state.createDraft;
        if(!d.projectId || !d.modelId){ state.createErrors = {title:'请先选择项目与模型'}; render(); break; }
        const model = state.models.find(m => m.id === d.modelId);
        const s = {id:'s' + Date.now(), title:d.title.trim() || ('排查日志 · ' + projectName(d.projectId) + ' · 11-17 19:20'), projectId:d.projectId, entrance:'排查日志', model:model ? model.display : '未知模型', status:'进行中', updated:'刚刚'};
        state.sessions.unshift(s); state.createOpen = false; state.sessionStatus = '进行中';
        state.currentSession = {id:s.id, title:s.title, projectId:s.projectId, model:s.model};
        state.events = []; state.tab = 'text'; state.callState = 'idle'; state.expandedEvent = null;
        state.page = 'session'; state.ui = 'default'; state.notice = {kind:'success', text:'会话已创建，状态：进行中'};
        render(); break;
      }
      case 'ask-delete': {
        const s = state.sessions.find(x => x.id === id);
        openConfirm('删除会话？','将同时删除该会话的：', '删除', () => {
          state.sessions = state.sessions.filter(x => x.id !== id);
          state.ui = 'success'; state.notice = {kind:'success', text:'会话已删除'};
          if(state.page === 'session') state.page = 'sessions';
          render();
        }, true, ['全部输入与调用事件','制品文件（sessions/' + id + '/）','全部 AiCallRecord 调用记录']);
        break;
      }
      case 'mark-complete': {
        openConfirm('标记为已完成？','完成后会话不再接受新的输入事件，且不提供重新打开。','标记完成', () => {
          state.sessionStatus = '已完成';
          const rec = state.sessions.find(x => x.id === state.currentSession.id);
          if(rec) rec.status = '已完成';
          state.events.push({time:'10:09', type:'status', title:'状态变更 · 已完成', body:'操作：标记完成（二次确认）· 操作人：当前用户（单用户自托管）'});
          state.notice = {kind:'success', text:'会话已标记为完成，输入已只读'};
          render();
        }, false);
        break;
      }
      case 'tab': state.tab = act.dataset.tab; render(); break;
      case 'toggle-advanced': state.advanced = !state.advanced; render(); break;
      case 'add-text': {
        const body = state.composer.body;
        if(!body.trim()){ toast('正文必填','error'); return; }
        if(body.length > 200000){ toast('已超出上限：当前 ' + body.length + ' 字符，上限 200,000 字符，请删减后再提交','error'); return; }
        state.events.push({time:'10:06', type:'input', title:'输入事件 · ' + (state.composer.title || '文本粘贴'), body:'前 3 行预览：\n' + body.split('\n').slice(0,3).join('\n'), full:body});
        state.composer = {title:'', body:''};
        toast('已添加到时间线');
        render(); break;
      }
      case 'focus-composer': state.tab = 'text'; render(); $('#composerBody') && $('#composerBody').focus(); break;
      case 'remove-file':
        state.uploadFiles.splice(Number(act.dataset.idx), 1); render(); break;
      case 'submit-upload': {
        const used = new Set(state.events.filter(x => x.type === 'artifact').map(x => x.title.replace('制品事件 · ','').replace(/\.[^.]+$/, '')));
        state.uploadFiles.forEach((f, i) => {
          const ext = (f.name.match(/\.[^.]+$/) || [''])[0];
          const base = f.name.replace(/\.[^.]+$/, '');
          let candidate = base, n = 1;
          while(used.has(candidate)){ candidate = base + '-' + n; n++; }
          used.add(candidate);
          const finalName = candidate + ext;
          state.events.push({time:'10:0' + (7 + i), type:'artifact', title:'制品事件 · ' + finalName, meta:f.sizeText, renamed:finalName !== f.name ? finalName : null});
        });
        state.uploadFiles = [];
        toast('文件已上传到会话');
        render(); break;
      }
      case 'run-call': {
        if(readOnly()) return;
        if(!state.callPrompt.trim()){ toast('提示必填','error'); return; }
        if(state.callPrompt.length > 200000){ toast('已超出上限：当前 ' + state.callPrompt.length + ' 字符，上限 200,000 字符，请删减后再发起','error'); return; }
        state.callState = 'loading'; render();
        setTimeout(() => {
          if(state.ui === 'error'){
            state.callState = 'bad';
            state.events.push({time:'10:08', type:'call', ok:false, title:'调用记录 · 内网-快速', meta:'失败 · 120s · 重试 1', digest:'提示摘要：请分析以下登录报错…', error:'401 Unauthorized：密钥无效或已过期'});
            toast('调用失败：401 Unauthorized','error');
          } else {
            state.callState = 'ok';
            state.events.push({time:'10:08', type:'call', ok:true, title:'调用记录 · 内网-快速', meta:'成功 · 8.4s · 重试 0', digest:'提示摘要：请分析以下登录报错…', result:'建议按以下顺序排查：\n1. 检查 access token 是否在网关侧被提前过期；\n2. 核对客户端刷新 token 的时钟偏移；\n3. 复现时抓取 401 响应头。'});
            toast('调用完成');
          }
          render();
        }, 900);
        break;
      }
      case 'expand-call':
        state.expandedCall = state.expandedCall === Number(act.dataset.idx) ? null : Number(act.dataset.idx);
        render(); break;
      case 'toggle-event': {
        const idx = Number(act.dataset.idx);
        state.expandedEvent = state.expandedEvent === idx ? null : idx;
        render(); break;
      }
      case 'modal-cancel': state.modal = null; render(); break;
      case 'modal-confirm': {
        const m = state.modal;
        state.modal = null;
        if(m && typeof m.onConfirm === 'function') m.onConfirm();
        else render();
        break;
      }
    }
  });

  /* 输入与下拉变更 */
  document.addEventListener('input', function(e){
    if(e.target.id === 'adminPassword'){ state.auth.password = e.target.value; return; }
    const f = e.target.dataset.field;
    if(!f) return;
    if(f === 'callPrompt'){
      state.callPrompt = e.target.value;
      render();
      const ta = $('#callPromptInput');
      if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
    const parts = f.split('.');
    if(parts.length < 2) return;
    const group = parts[0], key = parts[1];
    if(group === 'composer') { state.composer[key] = e.target.value; updateCounter(); return; }
    if(group === 'providerDraft') {
      state.providerDraft[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if(state.ui === 'error') state.ui = 'default';
      state.providerTest = 'idle';
      return;
    }
    if(group === 'modelDraft') { state.modelDraft[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; return; }
    if(group === 'projectDraft') { state.projectDraft[key] = e.target.value; return; }
    if(group === 'createDraft') { state.createDraft[key] = e.target.value; return; }
    if(group === 'filterProject') { state.filterProject = e.target.value; render(); return; }
    if(group === 'filterStatus') { state.filterStatus = e.target.value; render(); return; }
    if(group === 'callFilter') { state.callFilter[key] = e.target.value; render(); return; }
  });

  document.addEventListener('change', function(e){
    const f = e.target.dataset.field;
    if(f === 'selectedProvider'){ state.selectedProvider = e.target.value; state.modelForm = false; render(); return; }
    if(f === 'providerDraft.protocol'){ state.providerDraft.protocol = e.target.value; return; }
    if(f === 'providerDraft.enabled'){ state.providerDraft.enabled = e.target.checked; return; }
    if(f === 'modelDraft.enabled'){ state.modelDraft.enabled = e.target.checked; return; }
    if(f === 'composer.body'){ updateCounter(); return; }
    if(f && f.indexOf('createDraft.') === 0){ state.createDraft[f.split('.')[1]] = e.target.value; return; }
    if(f === 'filterProject' || f === 'filterStatus' || f === 'callFilter.project' || f === 'callFilter.session' || f === 'callFilter.range'){
      const parts = f.split('.');
      if(parts[0] === 'filterProject'){ state.filterProject = e.target.value; render(); return; }
      if(parts[0] === 'filterStatus'){ state.filterStatus = e.target.value; render(); return; }
      state.callFilter[parts[1]] = e.target.value;
      if(parts[1] === 'project') state.callFilter.session = 'all';
      render(); return;
    }
    if(e.target.id === 'fileInput'){
      const files = Array.prototype.slice.call(e.target.files || []);
      const allowed = ['.txt','.md','.markdown','.log','.json','.yaml','.yml','.csv','.sql'];
      let picked = files;
      const extra = [];
      if(files.length > 10){
        extra.push({name:'（本次选择 ' + files.length + ' 个文件）', sizeText:'', error:'单次最多上传 10 个文件'});
        picked = files.slice(0,10);
      }
      state.uploadFiles = picked.map(file => {
        const ext = (file.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
        let err = '';
        if(!allowed.includes(ext)) err = '不支持 ' + (ext || '无扩展名') + '；允许 .txt .md .markdown .log .json .yaml .yml .csv .sql';
        else if(file.size > 10 * 1024 * 1024) err = '超过 10MB 上限';
        return {name:file.name, sizeText:(file.size/1024).toFixed(1) + ' KB', error:err};
      }).concat(extra);
      render();
    }
  });

  /* 对话框 */
  function openConfirm(title, desc, confirmLabel, onConfirm, danger, items){
    state.modal = {title, desc, confirmLabel, onConfirm, danger, items};
    renderModal();
  }
  function renderModal(){
    const m = state.modal;
    if(!m) { const old = $('#modalRoot'); if(old) old.remove(); return; }
    let root = $('#modalRoot');
    if(!root){ root = document.createElement('div'); root.id = 'modalRoot'; document.body.appendChild(root); }
    root.innerHTML = '<div class="overlay" data-action="modal-cancel"><div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(m.title) + '</h3><p class="small muted" style="margin-top:0">' + esc(m.desc) + '</p>' +
      (m.items ? '<ul>' + m.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') +
      '<div class="modal-foot"><button class="btn" data-action="modal-cancel">取消</button><button class="btn ' + (m.danger ? 'btn-danger' : 'btn-primary') + '" data-action="modal-confirm">' + esc(m.confirmLabel) + '</button></div>' +
      '</div></div>';
  }

  /* 登录表单：回车或点击「登录」提交 */
  document.addEventListener('submit', function(e){
    if(e.target && e.target.id === 'loginForm'){ e.preventDefault(); submitLogin(); }
  });
  /* 点击用户菜单外部时收起 */
  document.addEventListener('click', function(e){
    if(state.userMenu && !e.target.closest('.user-menu')){ state.userMenu = false; render(); }
  });

  /* 键盘：Esc 关闭 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(state.modal){ state.modal = null; renderModal(); }
      else if(state.userMenu){ state.userMenu = false; render(); }
      else if(state.createOpen){ state.createOpen = false; render(); }
    }
  });

  /* 初始渲染：未登录时先落到登录页，保留 hash 指向的原目标（登录后跳回） */
  document.documentElement.setAttribute('data-theme', state.theme);
  state.pendingTarget = parseInitialTarget() || {page:'home', extra:{}};
  render();
  // 模态框与主渲染解耦：render 后重新挂载
  const _render = render;
  render = function(){ _render(); renderModal(); };
  renderModal();
})();
</script>
</body>
</html>
