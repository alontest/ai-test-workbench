[project]
name = "ai-test-workbench"
version = "0.1.0"
description = "AI 测试工作台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.164",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1.9,<2.2",
    "greenlet>=3.2,<4",
    "alembic>=1.20,<1.21",
    "aiosqlite>=0.22,<0.23",
    "asyncmy>=0.2.18,<0.3",
    "argon2-cffi>=25.1,<26",
    "cryptography>=50,<51",
    "openai>=3.52,<4",
    "anthropic>=2.9,<3",
    "python-multipart>=0.0.32,<0.1",
    "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
