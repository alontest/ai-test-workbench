<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="_mascot_1wo0d_5 _idle_1wo0d_27" aria-hidden="true" fill="none"><defs><style>/* 吉祥物角色动效：
   克制但有生命力——每个状态只驱动最能表达当前系统事实的部位，
   绝不散乱抖动。所有动画在 prefers-reduced-motion 下优雅降级为静态姿态。 */

._mascot_1wo0d_5 {
  display: block;
  flex: none;
  overflow: visible;
  user-select: none;
}

._character_1wo0d_12 {
  transform-origin: 60px 64px;
  transition: transform var(--duration-base, 180ms)
    var(--easing-standard, cubic-bezier(0.2, 0, 0, 1));
}

._compact_1wo0d_18 ._character_1wo0d_12 {
  transform-origin: 24px 24px;
}

._shadow_1wo0d_22 {
  transform-origin: 60px 108px;
}

/* ── idle：6s 平稳呼吸悬浮，地影随高度反向微缩 ── */
._idle_1wo0d_27 ._character_1wo0d_12 {
  animation: _floatBreathe_1wo0d_1 6s ease-in-out infinite;
}

._idle_1wo0d_27 ._shadow_1wo0d_22 {
  animation: _shadowBreathe_1wo0d_1 6s ease-in-out infinite;
}

._idle_1wo0d_27 ._coreGem_1wo0d_35 {
  animation: _gemPulse_1wo0d_1 4s ease-in-out infinite;
}

@keyframes _floatBreathe_1wo0d_1 {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-2.5px) scale(1.015);
  }
}

@keyframes _shadowBreathe_1wo0d_1 {
  0%,
  100% {
    transform: scaleX(1);
    opacity: 0.45;
  }
  50% {
    transform: scaleX(0.9);
    opacity: 0.32;
  }
}

@keyframes _gemPulse_1wo0d_1 {
  0%,
  100% {
    opacity: 0.78;
  }
  50% {
    opacity: 1;
  }
}

/* ── watching：身体微前倾锁定目标，雷达波轻闪 ── */
._watching_1wo0d_72 ._character_1wo0d_12 {
  transform: translateY(-1px) rotate(1.5deg);
}

._watching_1wo0d_72 ._propWatching_1wo0d_76 {
  animation: _radarBlink_1wo0d_1 2.2s ease-in-out infinite;
}

@keyframes _radarBlink_1wo0d_1 {
  0%,
  100% {
    opacity: 0.45;
  }
  50% {
    opacity: 1;
  }
}

/* ── analyzing：护目镜 HUD 准星匀速旋转，代码卡片微浮 ── */
._analyzing_1wo0d_91 ._scanRingLeft_1wo0d_91 {
  animation: _spinCw_1wo0d_1 2.4s linear infinite;
}

._analyzing_1wo0d_91 ._scanRingRight_1wo0d_95 {
  animation: _spinCcw_1wo0d_1 2.4s linear infinite;
}

._analyzing_1wo0d_91 ._propAnalyzing_1wo0d_99 {
  animation: _floatCard_1wo0d_1 2s ease-in-out infinite;
}

@keyframes _spinCw_1wo0d_1 {
  to {
    transform: rotate(360deg);
  }
}

@keyframes _spinCcw_1wo0d_1 {
  to {
    transform: rotate(-360deg);
  }
}

@keyframes _floatCard_1wo0d_1 {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}

/* ── warning：警觉脉冲 + 告警信标闪烁 ── */
._warning_1wo0d_126 ._character_1wo0d_12 {
  animation: _alertPulse_1wo0d_1 1.8s ease-in-out infinite;
}

._warning_1wo0d_126 ._propWarning_1wo0d_130 {
  animation: _beaconFlash_1wo0d_1 1.2s ease-in-out infinite;
}

@keyframes _alertPulse_1wo0d_1 {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.035);
  }
}

@keyframes _beaconFlash_1wo0d_1 {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  50% {
    opacity: 0.6;
    transform: translateY(-1.5px);
  }
}

/* ── success：PASS 徽章轻盈弹出后停稳 ── */
._success_1wo0d_157 ._propSuccess_1wo0d_157 {
  transform-origin: 98px 28px;
  animation: _badgePop_1wo0d_1 360ms cubic-bezier(0.2, 0.9, 0.25, 1.1) both;
}

@keyframes _badgePop_1wo0d_1 {
  from {
    opacity: 0;
    transform: scale(0.75) translateY(4px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* ── sleeping：深沉慢呼吸（8s），Zzz 缓缓浮动 ── */
._sleeping_1wo0d_174 ._character_1wo0d_12 {
  opacity: 0.82;
  animation: _deepSleep_1wo0d_1 8s ease-in-out infinite;
}

._sleeping_1wo0d_174 ._propSleeping_1wo0d_179 {
  animation: _zzzDrift_1wo0d_1 4s ease-in-out infinite;
}

@keyframes _deepSleep_1wo0d_1 {
  0%,
  100% {
    transform: translateY(1px) scaleY(0.985);
  }
  50% {
    transform: translateY(0) scaleY(1.01);
  }
}

@keyframes _zzzDrift_1wo0d_1 {
  0%,
  100% {
    opacity: 0.55;
    transform: translateY(1px);
  }
  50% {
    opacity: 0.95;
    transform: translateY(-2px);
  }
}

/* 尊重系统的「减少动态效果」：关闭所有位移与旋转，保留全部表情、道具和状态色 */
@media (prefers-reduced-motion: reduce) {
  ._mascot_1wo0d_5,
  ._mascot_1wo0d_5 * {
    animation: none !important;
    transition: none !important;
  }
}
