# 默认交付：app + mysql:8.4。端口只绑本机；密钥来自 .env，不写入镜像。
# 使用前：cp .env.example .env 并填写占位口令 / 32 字节 base64 加密密钥。
# 外接 MySQL：docker compose up app --no-deps，并把 AW_DATABASE_URL 指向现有实例（需 DDL 权限）。

name: ai-test-workbench

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workbench}
      MYSQL_USER: ${MYSQL_USER:-workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workbench}
      AW_DATABASE_URL: ""
      AW_DATA_DIR: /data
      AW_ALLOW_REMOTE: "true"
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "/app/scripts/docker-entrypoint.sh", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
